<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Elite — NovaFlex</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://novaflexusa.com/nova-elite.html">
<!--
  The portal moved to /nova-elite.html when the programme was renamed.

  This file stays because the welcome email sent to every existing member
  points here, and those are already in people's inboxes. A member following a
  link from an old mail must land in the portal, not on an error. The setup
  token travels in the query string, so it is carried across rather than
  dropped - losing it would mean a new member could not set a password at all.
-->
<!-- No meta refresh. A zero-second refresh fires on parse, beats the script
     below, and arrives at the portal with the query string stripped - which
     throws away the setup token and leaves a new member unable to set a
     password at all. The redirect is done in script so the token survives. -->
<style>
  body{margin:0;background:#141008;color:#cfc7b4;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
  a{color:#d4af49;}
</style>
<script>
  // Carry the query string (?setup=…, ?reset=…) and any hash through.
  (function () {
    location.replace('nova-elite.html' + (location.search || '') + (location.hash || ''));
  })();
</script>
</head>
<body>
  <!-- Only reached with scripting off. The portal itself needs JavaScript, so
       this is a link rather than a promise that something is happening. -->
  <p>NOVA Elite has moved. <a href="nova-elite.html">Open the portal</a>.</p>
</body>
</html>
