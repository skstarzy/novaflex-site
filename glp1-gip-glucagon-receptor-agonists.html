<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moved — NovaFlex</title>
<!--
  Unpublished for payment-processor compliance.

  An underwriting review flagged the public calculator and guides: under
  21 CFR 201.128 objective intent can be shown by "advertising matter, or oral
  or written statements", so preparation and handling material sitting next to
  a catalog can establish intended use even where every product is labelled RUO.
  The remedy required was to unpublish these assets and redirect them.

  A 301 would be correct and GitHub Pages cannot issue one, so this is a
  zero-delay meta refresh plus a canonical, which Google treats as a redirect.
  A real 301 should be added as a Cloudflare rule on the apex - that is the only
  layer here that can serve one.

  noindex is deliberate: unlike an ordinary rename, these URLs should leave the
  index rather than pass their equity on.

  The original files are kept in _unpublished/ - not deleted. If a processor
  later clears this material, restoring it is a file move plus the STATIC_PAGES
  entries in tools/build-seo.py.
-->
<link rel="canonical" href="https://novaflexusa.com/">
<meta http-equiv="refresh" content="0; url=/">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f7f4ee;color:#221f18;text-align:center;padding:24px;
       font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;}
  a{color:#8a6a24;font-weight:600;}
</style>
</head>
<body>
  <p>This page is no longer available. <a href="/">Return to NovaFlex</a>.</p>
  <script>location.replace('/');</script>
</body>
</html>
